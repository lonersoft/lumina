services:
  mysql:
    image: mariadb:11.4
    container_name: lumina_mysql
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-lumina_root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-lumina}
      MARIADB_USER: ${MARIADB_USER:-lumina}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-lumina_password}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - lumina_network
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$${MARIADB_ROOT_PASSWORD:-lumina_root}"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lumina_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-lumina_redis}
    volumes:
      - redis_data:/data
    networks:
      - lumina_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 20s
      retries: 10

  backend:
    image: ghcr.io/lonersoft/lumina-backend:latest
    container_name: lumina_backend
    restart: unless-stopped
    environment:
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_DATABASE=${MARIADB_DATABASE:-lumina}
      - DATABASE_USER=${MARIADB_USER:-lumina}
      - DATABASE_PASSWORD=${MARIADB_PASSWORD:-lumina_password}
      - DATABASE_ENCRYPTION=xchacha20
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-lumina_redis}
      - DATABASE_ENCRYPTION_KEY=${DATABASE_ENCRYPTION_KEY:-zKZ7//AocUD2wCuzjW5rdTbb8FvGBgKTZ8iCATslZ/8=}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "cli", "help"]
      timeout: 20s
      retries: 10
    volumes:
      - lumina_attachments:/var/www/html/public/attachments
      - ./.env:/var/www/html/storage/.env
      - lumina_snapshots:/var/www/html/storage/backups
    networks:
      - lumina_network

  frontend:
    image: ghcr.io/lonersoft/lumina-frontend:latest
    container_name: lumina_frontend
    restart: unless-stopped
    volumes: []
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      timeout: 20s
      retries: 10
    ports:
      - "4832:80"
    networks:
      - lumina_network

volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local
  lumina_attachments:
    driver: local
  lumina_snapshots:
    driver: local

networks:
  lumina_network:
    driver: bridge
